spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

    hikari:
      maximum-pool-size: 20
      minimum-idle: 0

springdoc:
  swagger-ui:
    enabled: true
    display-request-duration: true
  api-docs:
    enabled: true


langora:
  security:
    cookie:
      domain:
      secure: false
      same-site: Lax
    cors:
      allowed-origins:
        - "http://127.0.0.1:8080"
        - "http://127.0.0.1:5173"
      allow-credentials: true

logging:
  level:
    org.dsqrwym.langora.infrastructure.jooqcustom: DEBUG
