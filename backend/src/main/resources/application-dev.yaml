spring:
  datasource:
    hikari:
      # Neo 免费层 大概 100
      maximum-pool-size: 50
      minimum-idle: 0
      connection-timeout: 3000
      # Hikari：validation-timeout < connection-timeout
      validation-timeout: 2000
      # Neon「5 分钟无活跃查询则挂起对齐，让客户端先关掉即将失效的连接
      idle-timeout: 298000
      data-source-properties:
        ApplicationName: langora

  devtools:
    restart:
      enabled: false

springdoc:
  swagger-ui:
    enabled: true
    display-request-duration: true
  api-docs:
    enabled: true


langora:
  bootstrap:
    super-admin:
      # Local development defaults. Environment variables (or .env) still win.
      enabled: ${BOOTSTRAP_SUPER_ADMIN_ENABLED:true}
      email: ${BOOTSTRAP_SUPER_ADMIN_EMAIL:superadmin@langora.com}
      username: ${BOOTSTRAP_SUPER_ADMIN_USERNAME:SuperAdmin}
      password: ${BOOTSTRAP_SUPER_ADMIN_PASSWORD:SuperAdmin123}
      override-existing-password: ${BOOTSTRAP_SUPER_ADMIN_OVERRIDE_PASSWORD:false}

  security:
    cookie:
      domain:
      secure: false
      same-site: Lax
    cors:
      allowed-origins:
        - "http://127.0.0.1:8080"
        - "http://127.0.0.1:5173"
        - "http://localhost:5173"
        - "https://langora.dsqrwym.es"
      allow-credentials: true
    captcha:
      enabled: true
      # 测试 key 来自 https://developers.cloudflare.com/turnstile/troubleshooting/testing/
      #site-key: 1x00000000000000000000AA
      site-key: ${CAPTCHA_SITE_KEY}
      #secret-key: 1x0000000000000000000000000000000AA
      secret-key: ${CAPTCHA_SECRET_KEY}
      #expected-action: ""       # 测试 key 返回 action=""，跳过校验
      expected-action: langora-login
      allowed-hostnames: # 测试 key 返回 hostname=localhost，跳过校验
        - "localhost"
        - "langora.dsqrwym.es"
        - "127.0.0.1"
      fail-open: true
      connect-timeout: 2s
      read-timeout: 3s

logging:
  level:
    org.dsqrwym.langora.infrastructure.jooqcustom: DEBUG
