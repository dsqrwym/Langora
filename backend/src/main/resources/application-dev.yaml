spring:
  datasource:
    hikari:
      maximum-pool-size: 12
      minimum-idle: 0
      connection-timeout: 3000
      # Hikari：validation-timeout < connection-timeout
      validation-timeout: 2000
      # Neon「5 分钟无活跃查询则挂起对齐，让客户端先关掉即将失效的连接
      idle-timeout: 298000
      data-source-properties:
        ApplicationName: langora

springdoc:
  swagger-ui:
    enabled: true
    display-request-duration: true
  api-docs:
    enabled: true


langora:
  bootstrap:
    super-admin:
      # Local development defaults. Environment variables (or .env) still win.
      enabled: ${BOOTSTRAP_SUPER_ADMIN_ENABLED:true}
      email: ${BOOTSTRAP_SUPER_ADMIN_EMAIL:superadmin@langora.com}
      username: ${BOOTSTRAP_SUPER_ADMIN_USERNAME:SuperAdmin}
      password: ${BOOTSTRAP_SUPER_ADMIN_PASSWORD:SuperAdmin123}
      override-existing-password: ${BOOTSTRAP_SUPER_ADMIN_OVERRIDE_PASSWORD:false}

  security:
    cookie:
      domain:
      secure: false
      same-site: Lax
    cors:
      allowed-origins:
        - "http://127.0.0.1:8080"
        - "http://127.0.0.1:5173"
      allow-credentials: true

logging:
  level:
    org.dsqrwym.langora.infrastructure.jooqcustom: DEBUG
