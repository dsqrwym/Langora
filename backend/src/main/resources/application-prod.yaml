spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

    hikari:
      maximum-pool-size: 20
      minimum-idle: 0

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

langora:
  security:
    cookie:
      domain: ".domain.es"  # 允许跨子域名共享
      secure: true          # 生产 HTTPS 必须为 true
      same-site: Lax
    cors:
      allowed-origins:
        - "https://langora.domain.es"
      allow-credentials: true
