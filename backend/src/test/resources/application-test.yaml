spring:
  flyway:
    enabled: false

langora:
  bootstrap:
    super-admin:
      enabled: false
  security:
    jwt:
      access-token-expiration: 15m
      refresh-token-expiration: 1d
      # Deliberately public test values. Tests must not depend on the developer .env file.
      secret-key: test-only-jwt-secret-key-must-be-at-least-32-chars

    cookie:
      refresh-token-path: /langora/auth/admin/refresh

    csrf:
      secret-key: test-only-csrf-secret-key-must-be-at-least-32-chars
